<!DOCTYPE html>
<html lang="vi">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>QR BOX SCANNER</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>


<body>

<header class="topbar">

    <button
        id="backBtn"
        class="secondary-btn"
    >
        ← DANH SÁCH
    </button>


    <strong id="fileTitle">
        QR SCANNER
    </strong>


    <button
        id="saveBtn"
        class="primary-btn"
    >
        SAVE
    </button>

</header>


<main class="scanner-page">


    <!-- ===================================== -->
    <!-- SCANNER -->
    <!-- ===================================== -->

    <section class="scanner-panel">

        <div class="pair-head">

            <div
                id="pairTitle"
                class="pair-title"
            >
                CẶP #1
            </div>

            <div class="session-stats">

                <div class="stat-chip">
                    <span id="statElapsed" class="stat-value">00:00</span>
                    <span class="stat-label">Thời gian</span>
                </div>

                <div class="stat-chip">
                    <span id="statRate" class="stat-value">0</span>
                    <span class="stat-label">Cặp/phút</span>
                </div>

            </div>

        </div>


        <div
            id="scanMode"
            class="scan-mode old-mode"
        >
            <span class="scan-mode-dot"></span>
            <span class="scan-mode-icon">🔵</span>
            <span id="scanModeText" class="scan-mode-text">ĐANG QUÉT TEM CŨ</span>
        </div>

        <div id="currentOldBox" class="current-old-box hidden">
            <div class="current-old-label">
                OLD BOX ĐANG GHÉP
            </div>

            <div id="currentOldValue" class="current-old-value">
                -
            </div>
        </div>

        <div
            id="conditionText"
            class="condition-text"
        ></div>


        <div class="camera-wrap">

            <div class="camera-box">

                <video
                    id="camera"
                    autoplay
                    muted
                    playsinline
                ></video>

                <div class="scan-frame">

                    <div class="corner top-left"></div>
                    <div class="corner top-right"></div>
                    <div class="corner bottom-left"></div>
                    <div class="corner bottom-right"></div>

                </div>

                <div class="scan-line"></div>

                <div id="resultFlash" class="result-flash">
                    <div id="resultFlashIcon" class="result-flash-icon">✓</div>
                    <div id="resultFlashText" class="result-flash-text"></div>
                </div>

            </div>

        </div>


        <button
            id="cameraBtn"
            class="camera-btn"
        >
            📷 BẬT CAMERA
        </button>


        <div class="camera-tools">

            <button id="torchBtn" class="icon-btn hidden" title="Đèn flash">
                🔦 ĐÈN
            </button>

            <button id="switchCamBtn" class="icon-btn hidden" title="Đổi camera">
                🔄 ĐỔI CAM
            </button>

            <button id="soundBtn" class="icon-btn" title="Bật/tắt âm thanh">
                🔊 ÂM
            </button>

            <button id="undoBtn" class="icon-btn" title="Hoàn tác cặp cuối" disabled>
                ↩️ HOÀN TÁC
            </button>

        </div>


        <div class="manual-entry">

            <input
                id="manualInput"
                type="text"
                placeholder="Nhập mã thủ công nếu QR lỗi..."
                autocomplete="off"
            >

            <button id="manualBtn" class="secondary-btn">
                NHẬP
            </button>

        </div>


        <div
            id="scanMessage"
            class="scan-message"
        >
            Bấm BẬT CAMERA để bắt đầu.
        </div>


        <div class="counter">

            <div>
                CẶP
                <strong id="pairCount">
                    0
                </strong>
            </div>

            <div>
                OLD
                <strong id="oldCount">
                    0
                </strong>
            </div>

            <div>
                NEW
                <strong id="newCount">
                    0
                </strong>
            </div>

        </div>

    </section>


    <!-- ===================================== -->
    <!-- PAIRS -->
    <!-- ===================================== -->

    <section class="pairs-panel">

        <div class="pairs-header">

            <div>

                <h2>
                    Danh sách cặp
                </h2>

                <span
                    id="fileStatus"
                    class="status draft"
                >
                    DRAFT
                </span>

            </div>


            <div class="pairs-header-actions">

                <button
                    id="exportBtn"
                    class="secondary-btn small"
                    title="Xuất Excel"
                >
                    ⬇ EXCEL
                </button>

                <button
                    id="refreshBtn"
                    class="secondary-btn small"
                >
                    ↻
                </button>

            </div>

        </div>


        <div class="search-bar">

            <input
                id="searchInput"
                type="text"
                placeholder="🔍 Tìm theo mã OLD / NEW..."
                autocomplete="off"
            >

        </div>


        <div class="table-wrapper">

            <table>

                <thead>

                    <tr>

                        <th>
                            #
                        </th>

                        <th>
                            oldBox
                        </th>

                        <th>
                            newBox
                        </th>

                        <th>
                        </th>

                    </tr>

                </thead>


                <tbody
                    id="pairTable"
                ></tbody>

            </table>

        </div>

    </section>

</main>


<div id="toastContainer" class="toast-container"></div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="https://unpkg.com/@zxing/library@0.21.2/umd/index.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

<script src="js/config.js"></script>

<script src="js/supabase.js"></script>

<script src="js/scanner.js"></script>

</body>

</html>
